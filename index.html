  <title>Snkatha</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0f1117;
      --surface:    #1a1d2e;
      --toolbar-bg: #13162a;
      --toolbar-h:  54px;
      --header-h:   0px;
      --accent:     #4f8ef7;
      --accent-alt: #e94560;
      --text:       #e8eaf0;
      --text-dim:   #7a7d99;
      --border:     rgba(255,255,255,.09);
      --radius:     7px;
      --ease:       0.18s ease;
    }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ── Toolbar ──────────────────────────────────────────────────────────── */
    #toolbar {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--toolbar-h);
      background: var(--toolbar-bg);
      display: flex; align-items: center; gap: 5px;
      padding: 0 14px;
      z-index: 100;
      box-shadow: 0 1px 0 var(--border), 0 4px 20px rgba(0,0,0,.5);
    }
    .tb-title {
      flex: 1; font-size: 13px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tb-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text); cursor: pointer;
      padding: 5px 10px; border-radius: var(--radius);
      font-size: 12px; display: flex; align-items: center; gap: 4px;
      transition: background var(--ease), border-color var(--ease);
      user-select: none; white-space: nowrap; flex-shrink: 0;
    }
    .tb-btn:hover  { background: rgba(79,142,247,.15); border-color: var(--accent); }
    .tb-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tb-sep { width: 1px; height: 26px; background: var(--border); margin: 0 2px; flex-shrink: 0; }
    #page-input {
      background: rgba(255,255,255,.06); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius);
      padding: 4px 6px; width: 46px; font-size: 12px; text-align: center;
    }
    #page-input:focus { outline: none; border-color: var(--accent); }
    #page-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; }

    /* ── TOC Drawer ───────────────────────────────────────────────────────── */
    #toc {
      position: fixed; top: var(--toolbar-h); left: 0; bottom: 0;
      width: 280px; background: var(--surface);
      transform: translateX(-100%);
      transition: transform .28s ease;
      z-index: 90; overflow-y: auto; padding: 14px 0;
      box-shadow: 4px 0 24px rgba(0,0,0,.4);
      border-right: 1px solid var(--border);
    }
    #toc.open { transform: translateX(0); }
    #toc h3 {
      font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-dim);
      padding: 0 16px 10px;
    }
    .toc-item {
      display: block; padding: 8px 16px; cursor: pointer;
      font-size: 13px; color: var(--text);
      border-left: 3px solid transparent;
      transition: background var(--ease), border-color var(--ease);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toc-item:hover    { background: rgba(255,255,255,.05); border-color: var(--accent); }
    .toc-l2 { padding-left: 28px; font-size: 12px; color: var(--text-dim); }
    .toc-l3 { padding-left: 40px; font-size: 11px; color: var(--text-dim); }

    /* ── Stage ────────────────────────────────────────────────────────────── */
    #stage {
      position: fixed;
      top: var(--toolbar-h); left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      transition: left .28s ease;
      overflow: hidden;
    }
    #stage.toc-open { left: 280px; }

    /* ── Navigation Arrows ───────────────────────────────────────────────── */
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(19,22,42,.9); border: 1px solid var(--border);
      color: var(--text); cursor: pointer;
      width: 40px; height: 64px; border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; z-index: 10;
      transition: background var(--ease), opacity var(--ease);
      opacity: .55;
    }
    .nav-arrow:hover { background: var(--accent); opacity: 1; border-color: var(--accent); }
    #nav-prev { left: 8px; }
    #nav-next { right: 8px; }

    /* ── Flipbook Wrap ───────────────────────────────────────────────────── */
    #flipbook-wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      transform-origin: center center;
    }

    /* ── Canvas rendering quality (crisp text on all DPR levels) ────────── */
    #flipbook canvas {
      image-rendering: auto;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
    }

    /* ── Pan Overlay ─────────────────────────────────────────────────────── */
    #pan-overlay {
      position: absolute; inset: 0; z-index: 5;
      pointer-events: none; cursor: grab; touch-action: none; user-select: none;
    }
    #pan-overlay.active  { pointer-events: all; }
    #pan-overlay.panning { cursor: grabbing; }

    /* ── Thumbnail Strip ─────────────────────────────────────────────────── */
    #thumbs-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 0; overflow: hidden;
      background: rgba(10,12,22,.97);
      display: flex; align-items: center; gap: 8px; padding: 0 16px;
      transition: height .28s ease; z-index: 80;
      border-top: 1px solid var(--border);
    }
    #thumbs-bar.open { height: 108px; overflow-x: auto; overflow-y: hidden; }
    .thumb {
      flex-shrink: 0; height: 80px; cursor: pointer;
      border: 2px solid transparent; border-radius: 4px;
      opacity: .5; transition: opacity var(--ease), border-color var(--ease);
    }
    .thumb:hover, .thumb.active { opacity: 1; border-color: var(--accent); }

    /* ── Loading Overlay ─────────────────────────────────────────────────── */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 200; transition: opacity .5s ease;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(79,142,247,.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader p { margin-top: 16px; color: var(--text-dim); font-size: 14px; }

    /* ── Hint Bar ────────────────────────────────────────────────────────── */
    #hint {
      position: fixed; bottom: 10px; right: 12px;
      font-size: 11px; color: var(--text-dim);
      background: rgba(19,22,42,.82);
      padding: 5px 10px; border-radius: 5px;
      pointer-events: none; line-height: 1.7;
      border: 1px solid var(--border);
    }

    /* ── Share Toast ─────────────────────────────────────────────────────── */
    #share-toast {
      position: fixed; bottom: 50px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent); color: #fff;
      padding: 8px 18px; border-radius: 20px;
      font-size: 13px; opacity: 0;
      transition: opacity .25s ease, transform .25s ease;
      pointer-events: none; z-index: 300;
    }
    #share-toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    /* ── Touch-device minimum tap targets (all touch screens) ──────────── */
    @media (hover: none) {
      .tb-btn    { min-height: 40px; }
      .nav-arrow { opacity: 0.88; }
    }

    /* ── Phone  (< 600 px) — single-page, scrollable toolbar ────────────── */
    @media (max-width: 599px) {
      :root { --toolbar-h: 48px; }
      #toolbar {
        gap: 3px; padding: 0 6px;
        overflow-x: auto; overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      #toolbar::-webkit-scrollbar { display: none; }
      .tb-btn   { padding: 4px 7px; font-size: 11px; gap: 3px; }
      .tb-sep   { margin: 0 1px; height: 20px; }
      .tb-title { font-size: 11px; min-width: 50px; }
      #page-input { width: 34px; font-size: 11px; padding: 3px 4px; }
      #page-count { font-size: 11px; }
      /* Toolbar is scrollable on phone so we only hide navigation extremes */
      #btn-first, #btn-last, #btn-thumbs, #btn-toc { display: none; }
      #btn-zoom-in, #btn-zoom-out, #btn-zoom-fit { padding: 4px 6px; font-size: 11px; }
      .nav-arrow {
        width: 36px; height: 52px; font-size: 20px; opacity: 0.9;
      }
      #nav-prev { left: 2px; }
      #nav-next { right: 2px; }
      #thumbs-bar.open { height: 88px; }
      .thumb { height: 62px; }
      #hint { font-size: 10px; bottom: 6px; right: 6px; padding: 4px 7px; line-height: 1.5; }
      #toc { width: 100%; }
      #stage.toc-open { left: 0; }
    }

    /* ── Tablet  (600 px – 1023 px) — spread view, medium toolbar ────────── */
    @media (min-width: 600px) and (max-width: 1023px) {
      :root { --toolbar-h: 50px; }
      .tb-btn   { padding: 5px 9px; font-size: 12px; }
      .tb-sep   { height: 24px; margin: 0 2px; }
      .tb-title { font-size: 12px; }
      #page-input { width: 42px; font-size: 12px; }
      #page-count { font-size: 12px; }
      /* Hide only the extreme-navigation buttons to save toolbar space */
      #btn-first, #btn-last { display: none; }
      .nav-arrow {
        width: 38px; height: 60px; font-size: 22px;
      }
      #nav-prev { left: 5px; }
      #nav-next { right: 5px; }
      #thumbs-bar.open { height: 100px; }
      .thumb { height: 72px; }
      #toc { width: 240px; }
      #stage.toc-open { left: 240px; }
      #hint { font-size: 11px; }
    }

    /* ── Landscape phone: very tight vertical space ───────────────────────── */
    @media (max-width: 900px) and (max-height: 430px) {
      :root { --toolbar-h: 36px; }
      .tb-btn    { padding: 2px 6px; font-size: 10px; min-height: 0; }
      .nav-arrow { width: 26px; height: 40px; font-size: 15px; }
      #hint      { display: none; }
    }

    /* ── iPhone / Android safe-area insets (notch, home bar) ────────────── */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      #toolbar    { padding-left:  max(14px, env(safe-area-inset-left));
                     padding-right: max(14px, env(safe-area-inset-right)); }
      #thumbs-bar { padding-bottom: env(safe-area-inset-bottom); }
      #hint       { bottom: calc(10px + env(safe-area-inset-bottom)); }
    }

    /* ── Print ────────────────────────────────────────────────────────────── */
    @media print {
      #toolbar, .nav-arrow, #hint, #pan-overlay,
      #thumbs-bar, #loader, #share-toast { display: none !important; }
      #stage { top: 0; }
      #flipbook-wrap { transform: none !important; }
    }
  </style>

<script src="assets/js/page-flip.browser.js"></script>
<script>
(function () {
  "use strict";

  const IMAGES    = ["assets/pages/page_0001.jpg", "assets/pages/page_0002.jpg", "assets/pages/page_0003.jpg", "assets/pages/page_0004.jpg", "assets/pages/page_0005.jpg", "assets/pages/page_0006.jpg", "assets/pages/page_0007.jpg", "assets/pages/page_0008.jpg", "assets/pages/page_0009.jpg", "assets/pages/page_0010.jpg", "assets/pages/page_0011.jpg", "assets/pages/page_0012.jpg", "assets/pages/page_0013.jpg", "assets/pages/page_0014.jpg", "assets/pages/page_0015.jpg", "assets/pages/page_0016.jpg", "assets/pages/page_0017.jpg", "assets/pages/page_0018.jpg", "assets/pages/page_0019.jpg", "assets/pages/page_0020.jpg", "assets/pages/page_0021.jpg", "assets/pages/page_0022.jpg", "assets/pages/page_0023.jpg", "assets/pages/page_0024.jpg", "assets/pages/page_0025.jpg", "assets/pages/page_0026.jpg", "assets/pages/page_0027.jpg", "assets/pages/page_0028.jpg", "assets/pages/page_0029.jpg", "assets/pages/page_0030.jpg", "assets/pages/page_0031.jpg", "assets/pages/page_0032.jpg", "assets/pages/page_0033.jpg", "assets/pages/page_0034.jpg", "assets/pages/page_0035.jpg", "assets/pages/page_0036.jpg", "assets/pages/page_0037.jpg", "assets/pages/page_0038.jpg", "assets/pages/page_0039.jpg", "assets/pages/page_0040.jpg", "assets/pages/page_0041.jpg", "assets/pages/page_0042.jpg", "assets/pages/page_0043.jpg", "assets/pages/page_0044.jpg", "assets/pages/page_0045.jpg", "assets/pages/page_0046.jpg", "assets/pages/page_0047.jpg"];
  const BOOKMARKS = [];
  const PAGE_W    = 1654;
  const PAGE_H    = 1654;
  const TOTAL     = 47;

  let pageFlip   = null;
  let zoomScale  = 1.0;
  let panX       = 0;
  let panY       = 0;
  let autoTimer  = null;
  let tocOpen    = false;
  let thumbsOpen = false;

  const $ = id => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function currentIndex() {
    return pageFlip ? pageFlip.getCurrentPageIndex() : 0;
  }

  function syncUI() {
    $('page-input').value = currentIndex() + 1;
    document.querySelectorAll('.thumb').forEach((el, i) => {
      el.classList.toggle('active', i === currentIndex());
    });
  }

  // ── Sound ──────────────────────────────────────────────────────────────────
  let _soundOn   = true;
  let _prevState = '';

  function playFlipSound() {
    if (!_soundOn) return;
    const audio = $('flip-sound');
    if (!audio) return;
    audio.currentTime = 0;
    audio.play().catch(() => {});
  }

  function toggleSound() {
    _soundOn = !_soundOn;
    $('btn-sound').classList.toggle('active', _soundOn);
    $('btn-sound').innerHTML = _soundOn ? '&#128266;' : '&#128263;';
    if (_soundOn) playFlipSound();
  }

  // ── Zoom + Pan ─────────────────────────────────────────────────────────────
  function clampedPan(px, py) {
    const stage = $('stage');
    const wrap  = $('flipbook-wrap');
    const maxPX = Math.max(0, (zoomScale * wrap.offsetWidth  - stage.offsetWidth)  / 2);
    const maxPY = Math.max(0, (zoomScale * wrap.offsetHeight - stage.offsetHeight) / 2);
    return [clamp(px, -maxPX, maxPX), clamp(py, -maxPY, maxPY)];
  }

  function commitTransform() {
    $('flipbook-wrap').style.transform =
      `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
  }

  function applyZoom(scale) {
    zoomScale = clamp(scale, 0.35, 4.5);
    if (zoomScale <= 1.0) {
      panX = panY = 0;
      $('pan-overlay').classList.remove('active');
    } else {
      [panX, panY] = clampedPan(panX, panY);
      $('pan-overlay').classList.add('active');
    }
    commitTransform();
  }

  // ── Flipbook init ──────────────────────────────────────────────────────────
  function initFlipbook(restorePage) {
    const wrap     = $('flipbook-wrap');
    const isPhone  = window.innerWidth < 600;
    const isTablet = !isPhone && window.innerWidth < 1024;
    const isMobile = isPhone;
    const thumbH   = thumbsOpen ? (isPhone ? 88 : 100) : 0;
    const availW   = wrap.offsetWidth  - 20;
    const availH   = wrap.offsetHeight - thumbH - 20;
    const ratio    = PAGE_W / PAGE_H;

    let cssW, cssH;
    if (isMobile) {
      let h = availH, w = h * ratio;
      if (w > availW) { w = availW; h = w / ratio; }
      cssW = Math.max(1, Math.floor(w));
      cssH = Math.max(1, Math.floor(h));
    } else {
      let h = availH, w = h * ratio * 2;
      if (w > availW) { w = availW; h = w / (ratio * 2); }
      cssW = Math.max(1, Math.floor(w / 2));
      cssH = Math.max(1, Math.floor(h));
    }

    const dpr     = Math.min(window.devicePixelRatio || 1, 3);
    const renderW = Math.floor(cssW * dpr);
    const renderH = Math.floor(cssH * dpr);

    wrap.innerHTML = '';

    const sizer = document.createElement('div');
    sizer.style.cssText =
      `width:${isMobile ? cssW : cssW * 2}px;height:${cssH}px;overflow:hidden;flex-shrink:0;`;

    const inner = document.createElement('div');
    inner.style.cssText =
      `transform:scale(${1 / dpr});transform-origin:top left;`;

    const flipEl = document.createElement('div');
    flipEl.id = 'flipbook';
    inner.appendChild(flipEl);
    sizer.appendChild(inner);
    wrap.appendChild(sizer);

    panX = panY = 0;
    zoomScale = 1.0;
    commitTransform();
    $('pan-overlay').classList.remove('active');

    pageFlip = new St.PageFlip(flipEl, {
      width:               renderW,
      height:              renderH,
      size:                'fixed',
      maxShadowOpacity:    0.85,
      showCover:           true,
      mobileScrollSupport: false,
      clickEventForward:   false,
      usePortrait:         isMobile,
      drawShadow:          true,
      flippingTime:        800,
      useMouseEvents:      true,
      swipeDistance:       isPhone ? 20 : (isTablet ? 22 : 25),
      autoSize:            false,
      showPageCorners:     true,
      disableFlipByClick:  false,
    });

    pageFlip.loadFromImages(IMAGES);

    pageFlip.on('changeState', state => {
      if (state === 'flipping' && _prevState !== 'flipping') playFlipSound();
      _prevState = state;
      syncUI();
    });
    pageFlip.on('init', () => {
      $('loader').classList.add('hidden');
      if (restorePage !== undefined) pageFlip.turnToPage(restorePage);
      syncUI();
    });
  }

  // ── TOC ────────────────────────────────────────────────────────────────────
  function buildToc() {
    const container = $('toc-items');
    if (!BOOKMARKS.length) {
      container.innerHTML =
        '<p style="padding:0 16px;color:var(--text-dim);font-size:13px">No outline found.</p>';
      return;
    }
    BOOKMARKS.forEach(bm => {
      const el = document.createElement('div');
      el.className = 'toc-item' +
        (bm.level === 2 ? ' toc-l2' : bm.level >= 3 ? ' toc-l3' : '');
      el.textContent = bm.title;
      el.title = 'Page ' + (bm.page + 1);
      el.addEventListener('click', () => { pageFlip.turnToPage(bm.page); closeToc(); });
      container.appendChild(el);
    });
  }

  function toggleToc() {
    tocOpen = !tocOpen;
    $('toc').classList.toggle('open', tocOpen);
    $('stage').classList.toggle('toc-open', tocOpen);
    $('btn-toc').classList.toggle('active', tocOpen);
  }
  function closeToc() { if (tocOpen) toggleToc(); }

  // ── Thumbnails ─────────────────────────────────────────────────────────────
  function buildThumbs() {
    const bar = $('thumbs-bar');
    if (bar.children.length) return;
    IMAGES.forEach((src, i) => {
      const img     = document.createElement('img');
      img.src       = src;
      img.className = 'thumb';
      img.title     = 'Page ' + (i + 1);
      img.loading   = 'lazy';
      img.addEventListener('click', () => pageFlip.turnToPage(i));
      bar.appendChild(img);
    });
  }

  function toggleThumbs() {
    thumbsOpen = !thumbsOpen;
    $('thumbs-bar').classList.toggle('open', thumbsOpen);
    $('btn-thumbs').classList.toggle('active', thumbsOpen);
    if (thumbsOpen) buildThumbs();
  }

  // ── Auto-flip ──────────────────────────────────────────────────────────────
  function toggleAuto() {
    if (autoTimer) {
      clearInterval(autoTimer);
      autoTimer = null;
      $('btn-auto').classList.remove('active');
      $('btn-auto').innerHTML = '&#9654; Auto';
    } else {
      autoTimer = setInterval(() => {
        if (currentIndex() >= TOTAL - 1) { toggleAuto(); }
        else { pageFlip.flipNext(); }
      }, 3000);
      $('btn-auto').classList.add('active');
      $('btn-auto').innerHTML = '&#9646;&#9646; Stop';
    }
  }

  // ── Fullscreen ─────────────────────────────────────────────────────────────
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
      $('btn-fs').innerHTML = '&#x26F6; Exit';
    } else {
      document.exitFullscreen();
      $('btn-fs').innerHTML = '&#x26F6;';
    }
  }

  // ── Share ──────────────────────────────────────────────────────────────────
  function shareLink() {
    navigator.clipboard.writeText(location.href).catch(() => {});
    const toast = $('share-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ── Event wiring ───────────────────────────────────────────────────────────
  function wireEvents() {
    $('btn-toc').addEventListener('click',      toggleToc);
    $('nav-prev').addEventListener('click',     () => pageFlip.flipPrev());
    $('nav-next').addEventListener('click',     () => pageFlip.flipNext());
    $('btn-first').addEventListener('click',    () => pageFlip.turnToPage(0));
    $('btn-prev').addEventListener('click',     () => pageFlip.flipPrev());
    $('btn-next').addEventListener('click',     () => pageFlip.flipNext());
    $('btn-last').addEventListener('click',     () => pageFlip.turnToPage(TOTAL - 1));
    $('btn-zoom-in').addEventListener('click',  () => applyZoom(zoomScale + 0.15));
    $('btn-zoom-out').addEventListener('click', () => applyZoom(zoomScale - 0.15));
    $('btn-zoom-fit').addEventListener('click', () => applyZoom(1.0));
    $('btn-thumbs').addEventListener('click',   toggleThumbs);
    $('btn-auto').addEventListener('click',     toggleAuto);
    $('btn-fs').addEventListener('click',       toggleFullscreen);
    $('btn-share').addEventListener('click',    shareLink);
    $('btn-sound').addEventListener('click',    toggleSound);

    $('page-input').addEventListener('change', () => {
      const p = parseInt($('page-input').value, 10);
      if (p >= 1 && p <= TOTAL) pageFlip.turnToPage(p - 1);
    });

    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.key) {
        case 'ArrowLeft':  case 'ArrowUp':   pageFlip.flipPrev();           break;
        case 'ArrowRight': case 'ArrowDown': pageFlip.flipNext();           break;
        case 'Home': pageFlip.turnToPage(0);                                break;
        case 'End':  pageFlip.turnToPage(TOTAL - 1);                       break;
        case 'f': case 'F': toggleFullscreen();                            break;
        case 't': case 'T': toggleToc();                                   break;
        case 'h': case 'H': toggleThumbs();                                break;
        case 'a': case 'A': toggleAuto();                                  break;
        case 's': case 'S': toggleSound();                                 break;
        case '+': case '=': applyZoom(zoomScale + 0.15);                   break;
        case '-': case '_': applyZoom(zoomScale - 0.15);                   break;
        case '0':           applyZoom(1.0);                                break;
      }
    });

    // Ctrl+Scroll = zoom; plain scroll when zoomed = pan
    document.addEventListener('wheel', e => {
      if (e.ctrlKey) {
        e.preventDefault();
        applyZoom(zoomScale + (e.deltaY < 0 ? 0.1 : -0.1));
      } else if (zoomScale > 1.0) {
        e.preventDefault();
        [panX, panY] = clampedPan(panX - e.deltaX, panY - e.deltaY);
        commitTransform();
      }
    }, { passive: false });

    // Mouse drag-to-pan
    const overlay = $('pan-overlay');
    let _mdDrag = false, _mdStart = {};
    overlay.addEventListener('mousedown', e => {
      _mdDrag  = true;
      _mdStart = { x: e.clientX, y: e.clientY, px: panX, py: panY };
      overlay.classList.add('panning');
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!_mdDrag) return;
      [panX, panY] = clampedPan(
        _mdStart.px + (e.clientX - _mdStart.x),
        _mdStart.py + (e.clientY - _mdStart.y)
      );
      commitTransform();
    });
    document.addEventListener('mouseup', () => {
      _mdDrag = false;
      overlay.classList.remove('panning');
    });

    // Touch drag-to-pan (overlay active only when zoomed)
    let _tpStart = {};
    overlay.addEventListener('touchstart', e => {
      if (e.touches.length === 1)
        _tpStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, px: panX, py: panY };
    }, { passive: true });
    overlay.addEventListener('touchmove', e => {
      if (e.touches.length === 1) {
        [panX, panY] = clampedPan(
          _tpStart.px + (e.touches[0].clientX - _tpStart.x),
          _tpStart.py + (e.touches[0].clientY - _tpStart.y)
        );
        commitTransform();
        e.preventDefault();
      }
    }, { passive: false });

    // Pinch-to-zoom + double-tap-to-zoom
    let _pinchDist = null, _tapWasMulti = false;
    document.addEventListener('touchstart', e => {
      if (e.touches.length >= 2) {
        _tapWasMulti = true;
        _pinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (e.touches.length === 2 && _pinchDist !== null) {
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        applyZoom(zoomScale * (d / _pinchDist));
        _pinchDist = d;
        e.preventDefault();
      }
    }, { passive: false });
    document.addEventListener('touchend', e => {
      if (e.touches.length < 2) _pinchDist = null;
    }, { passive: true });

    // Double-tap: toggle fit (1×) ↔ 2.5× for comfortable reading
    let _lastTap = 0, _lastTapX = 0, _lastTapY = 0;
    document.addEventListener('touchend', e => {
      if (e.touches.length === 0 && _tapWasMulti) { _tapWasMulti = false; return; }
      if (_tapWasMulti || e.changedTouches.length !== 1 || e.touches.length > 0) return;
      const now = Date.now(), cx = e.changedTouches[0].clientX, cy = e.changedTouches[0].clientY;
      if (now - _lastTap < 300 && Math.hypot(cx - _lastTapX, cy - _lastTapY) < 35) {
        e.preventDefault();
        applyZoom(zoomScale > 1.05 ? 1.0 : 2.5);
        _lastTap = 0;
      } else {
        _lastTap = now; _lastTapX = cx; _lastTapY = cy;
      }
    }, { passive: false });

    // Resize + orientation
    let _resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(() => { initFlipbook(currentIndex()); }, 280);
    });
    window.addEventListener('orientationchange', () => {
      setTimeout(() => { initFlipbook(currentIndex()); }, 450);
    });
  }

  // ── Bootstrap ──────────────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    buildToc();
    wireEvents();
    initFlipbook();

    const isTouch  = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const isPhoneHint = window.innerWidth < 600;
    $('hint').innerHTML = isTouch
      ? (isPhoneHint
          ? 'Swipe to flip &nbsp;|&nbsp; Double-tap or pinch to zoom &nbsp;|&nbsp; Drag when zoomed'
          : 'Swipe or tap edge to flip &nbsp;|&nbsp; Double-tap or pinch to zoom &nbsp;|&nbsp; Drag when zoomed')
      : '&larr; &rarr; Navigate &nbsp;|&nbsp; Ctrl+Scroll Zoom &nbsp;|&nbsp; Drag when zoomed &nbsp;|&nbsp; <kbd>F</kbd> Full &nbsp;|&nbsp; <kbd>A</kbd> Auto &nbsp;|&nbsp; <kbd>S</kbd> Sound';
  });

})();
</script>
</body>
</html>
